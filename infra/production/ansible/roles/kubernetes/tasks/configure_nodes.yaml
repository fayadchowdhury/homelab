- name: Apply role labels to nodes
  ansible.builtin.command: >
    kubectl label node {{ item.1 }} role/{{ item.0.key }}=true --overwrite
  with_subelements:
    - "{{ role_mappings | dict2items }}"
    - value
  loop_control:
    label: "{{ item.1 }} -> role/{{ item.0.key }}"
  vars:
    role_mappings:
      control:   "{{ groups.get('control', []) }}"
      notebooks: "{{ groups.get('notebooks', []) }}"
      apps:      "{{ groups.get('apps', []) }}"
      monitor:   "{{ groups.get('monitor', []) }}"
      store:     "{{ groups.get('store', []) }}"
      db:        "{{ groups.get('db', []) }}"
  register: label_result
  changed_when: "'not labeled' not in label_result.stdout"
  environment:
    KUBECONFIG: "{{ kubeconfig_out | default(lookup('env','HOME') + '/.kube/config-production') }}"

- name: Taint control-plane nodes (NoSchedule)
  ansible.builtin.command: >
    kubectl taint nodes {{ item }}
    node-role.kubernetes.io/control-plane=:NoSchedule
    --overwrite
  loop: "{{ groups['control'] }}"
  loop_control:
    label: "{{ item }} -> control-plane NoSchedule"
  register: control_taint
  changed_when: "'tainted' in control_taint.stdout or 'updated' in control_taint.stdout"
  environment:
    KUBECONFIG: "{{ kubeconfig_out | default(lookup('env','HOME') + '/.kube/config-production') }}"

- name: Get node labels and taints
  ansible.builtin.shell: |
    echo "=== NODE LABELS ==="
    kubectl get nodes -L role/control,role/notebooks,role/apps,role/monitor,role/store,role/db
    echo ""
    echo "=== NODE TAINTS ==="
    kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints
  register: node_config
  changed_when: false
  environment:
    KUBECONFIG: "{{ kubeconfig_out | default(lookup('env','HOME') + '/.kube/config-production') }}"

- name: Display node configuration
  ansible.builtin.debug:
    msg: "{{ node_config.stdout_lines }}"