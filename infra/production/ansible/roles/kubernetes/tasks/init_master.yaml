- name: Set kubelet node-ip to management network
  become: yes
  copy:
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ ansible_host }}
    dest: /etc/default/kubelet
    mode: '0644'

- name: Restart kubelet
  become: yes
  systemd:
    name: kubelet
    state: restarted

- name: Initialize kubeadm master
  become: yes
  command: |
    kubeadm init
      --control-plane-endpoint={{ ansible_host }}
      --apiserver-advertise-address={{ ansible_host }}
      --node-name {{ inventory_hostname }}
      --pod-network-cidr=10.244.0.0/16
  args:
    creates: /etc/kubernetes/admin.conf

- name: Read admin kubeconfig as root
  become: yes
  slurp:
    src: /etc/kubernetes/admin.conf
  register: admin_kubeconfig_raw

- name: Ensure .kube directory exists
  become: false
  file:
    path: "{{ ansible_env.HOME }}/.kube"
    state: directory
    mode: '0755'

- name: Export kubeconfig for workers
  set_fact:
    kube_join_admin_conf: "{{ admin_kubeconfig_raw.content | b64decode }}"

- name: Install kubeconfig for user
  become: false
  copy:
    content: "{{ admin_kubeconfig_raw.content | b64decode }}"
    dest: "{{ ansible_env.HOME }}/.kube/config"
    mode: '0644'

- name: Download Flannel manifest
  get_url:
    url: https://github.com/flannel-io/flannel/releases/download/v0.28.4/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: "0644"

- name: Pin Flannel to the 2.5G interface
  replace:
    path: /tmp/kube-flannel.yml
    regexp: '(\s+)- --kube-subnet-mgr'
    replace: '\1- --kube-subnet-mgr\1- --iface=eth1'

- name: Install Flannel CNI
  command: kubectl apply -f /tmp/kube-flannel.yml

- name: Get kubeadm join command
  shell: kubeadm token create --print-join-command
  register: kube_join_cmd

- name: Set kubeadm join command fact
  set_fact:
    kube_join_command: "{{ kube_join_cmd.stdout }}"

- name: Download kubeconfig to local machine
  fetch:
    src: "{{ ansible_env.HOME }}/.kube/config"
    dest: "{{ kubeconfig_out | default(lookup('env','HOME') + '/.kube/config-production') }}"
    flat: yes