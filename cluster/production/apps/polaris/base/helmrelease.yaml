apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: polaris
spec:
  interval: 30m
  timeout: 20m
  
  install:
    timeout: 60m
    remediation:
      retries: 3
  
  upgrade:
    remediation:
      retries: 3
  
  chart:
    spec:
      chart: polaris
      version: '1.8.0'
      sourceRef:
        kind: HelmRepository
        name: polaris
        namespace: polaris
      interval: 12h
  
  values:
    image:
      tag: "1.8.0"

    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: role/compute
                  operator: In
                  values:
                    - "true"

    persistence:
      type: relational-jdbc
      relationalJdbc:
        secret:
          name: polaris-db-credentials

    realmContext:
      type: default
      realms:
        - POLARIS
      requireHeader: true

    storage:
      secret:
        name: rustfs-credentials
        awsAccessKeyId: RUSTFS_ACCESS_KEY
        awsSecretAccessKey: RUSTFS_SECRET_KEY
    extraEnv:
      - name: AWS_REGION
        value: us-east-1

    httproute:
      enabled: true
      gatewayName: traefik-gateway
      gatewayNamespace: traefik
      hosts:
        - polaris.home.com

    

    