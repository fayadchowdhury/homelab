apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: superset-operator
  namespace: superset-operator
spec:
  interval: 30m
  releaseName: superset-operator
  chart:
    spec:
      chart: superset-operator
      version: "0.3.1"
      sourceRef:
        kind: HelmRepository
        name: superset-kubernetes-operator
        namespace: superset-operator
      interval: 12h
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/apache/superset-kubernetes-operator
      tag: "0.3.1"
      pullPolicy: IfNotPresent
    replicas: 1
    leaderElection:
      enabled: true
    nodeSelector:
      role/apps: "true"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    watch:
      scope: cluster
    metrics:
      enabled: true
      serviceMonitor:
        enabled: false