apiVersion: batch/v1
kind: Job
metadata:
  name: portfolio-redis-restore
  namespace: portfolio
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-restore
          image: redis:7-alpine
          env:
            - name: REDIS_HOST
              value: "redis-lb.redis.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              R="redis-cli -h $REDIS_HOST -p $REDIS_PORT"

              echo "Waiting for Redis at ${REDIS_HOST}:${REDIS_PORT}..."
              until $R ping 2>&1 | grep -q PONG; do
                echo "  Not ready, retrying in 3s..."
                sleep 3
              done
              echo "Redis is ready."

              # ---------------------------------------------------------------
              # Seed-if-missing: every write below is conditional (NX), so a
              # rerun fills in absent keys and NEVER overwrites existing data.
              # There is deliberately no DEL. To force a new value from Git,
              # delete that key by hand first, then let the Job rerun.
              # Each command prints OK (written) or (nil)/0 (already existed).
              # ---------------------------------------------------------------

              echo "Writing STRING keys (SET ... NX)..."

              $R SET name "Ahmad Al Fayad Chowdhury" NX

              $R SET intro \
                "Hi, I'm Fayad, a data-focused software engineer exploring the intersections of machine learning, systems, and homelabbing." NX

              echo "Writing JSON keys (JSON.SET ... NX)..."

              $R JSON.SET navbarLeader '$' \
                '{"text":"fayadchowdhury","specialChar":"_"}' NX

              $R JSON.SET taglines '$' \
                '[{"text":"Distilling data into decisions","icon":"/hero-tagline-icons/data.svg"},{"text":"Connecting compute in clusters","icon":"/hero-tagline-icons/compute.svg"},{"text":"Igniting ideas into impact","icon":"/hero-tagline-icons/ideas.svg"},{"text":"Architecting AI into amazement","icon":"/hero-tagline-icons/ai.svg"}]' NX

              $R JSON.SET navbarLinks '$' \
                '[{"label":"Experience","url":"#work"},{"label":"Projects","url":"#projects"},{"label":"Skills","url":"#skills"}]' NX

              $R JSON.SET socials '$' \
                '[{"icon":"/hero-social-icons/github.svg","link":"https://github.com/fayadchowdhury"},{"icon":"/hero-social-icons/linkedin.svg","link":"https://www.linkedin.com/in/ahmad-al-fayad-chowdhury/"}]' NX

              echo "Writing HASH key (HSETNX per field)..."

              $R HSETNX contactForm title "Get in touch"
              $R HSETNX contactForm description "I'd love to hear from you!"

              # ---------------------------------------------------------------
              # Verify
              # ---------------------------------------------------------------
              echo ""
              echo "=== Verification ==="
              echo "Key count: $($R DBSIZE)"
              echo ""

              for key in name intro; do
                TYPE=$($R TYPE "$key")
                VAL=$($R GET "$key" | head -c 60)
                echo "  [$TYPE] $key = $VAL..."
              done

              for key in navbarLeader taglines navbarLinks socials; do
                TYPE=$($R TYPE "$key")
                VAL=$($R JSON.GET "$key" | head -c 60)
                echo "  [$TYPE] $key = $VAL..."
              done

              TYPE=$($R TYPE contactForm)
              echo "  [$TYPE] contactForm fields:"
              $R HGETALL contactForm | awk 'NR%2{printf "    %s -> ",$0;next}1'

              echo ""
              echo "Redis seed complete."