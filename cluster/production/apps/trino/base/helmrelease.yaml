apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: trino
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: trino
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: trino
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "484"
    server:
      workers: 0
      config:
        query:
          maxMemory: "1GB"
    additionalConfigProperties:
      - catalog.management=dynamic
      - catalog.store=file
      - http-server.process-forwarded=true
    coordinator:
      additionalConfigFiles:
          catalog-store.properties: |
            catalog.config-dir=/data/catalogs
      config:
        nodeScheduler:
          includeCoordinator: true
      deployment:
        strategy:
          type: Recreate
      jvm:
        maxHeapSize: "2G"
      resources:
        requests:
          cpu: "500m"
          memory: "2560Mi"
          ephemeral-storage: "2Gi"
        limits:
          memory: "3Gi"
          ephemeral-storage: "4Gi"
      additionalVolumes:
        - name: dynamic-catalogs
          persistentVolumeClaim:
            claimName: trino-dynamic-catalogs
      additionalVolumeMounts:
        - name: dynamic-catalogs
          mountPath: /data/catalogs
    envFrom:
      - secretRef:
          name: trino-rustfs-credentials
      - secretRef:
          name: trino-polaris-credentials
    gateway:
      enabled: true
      parentRefs:
        - name: traefik-gateway
          namespace: traefik
          sectionName: websecure
      hostnames:
        - trino.home.com
      rules:
        - path:
            type: PathPrefix
            value: /