apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-cluster-reader
subjects:
  - kind: ServiceAccount
    name: airflow-db-init
    namespace: airflow
  - kind: ServiceAccount
    name: portfolio-db-init
    namespace: portfolio
  - kind: ServiceAccount
    name: polaris-db-init
    namespace: polaris
roleRef:
  kind: ClusterRole
  name: cnpg-cluster-reader
  apiGroup: rbac.authorization.k8s.io